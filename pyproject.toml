[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "KAIROS Institutional Multi-Agent AI Trading System - Phase 1 Data Acquisition & MCP Integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KAIROS Data Engineering Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "pyarrow>=14.0.0",
    "fastmcp>=0.1.0",
    "yfinance>=0.2.35",
    "pandas>=2.1.0",
    "feedparser>=6.0.10",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
database = [
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kairos*", "schemas*", "collectors*", "mcp_servers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
