[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "Multi-agent Indian equity research, debate, memory and simulated trade proposals"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KAIROS Data Engineering Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "pyarrow>=14.0.0",
    "fastmcp>=0.1.0",
    "yfinance>=0.2.35",
    "pandas>=2.1.0",
    "feedparser>=6.0.10",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "crewai>=1.15.30,<1.16",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "appdirs>=1.4.4",
    "json5>=0.10.0",
    "langfuse>=3.15.0,<4",
    "openinference-instrumentation-crewai>=1.1.27",
    "openinference-instrumentation-google-adk>=1.1.6",
    "google-adk[a2a]>=2.14.1,<3",
    "a2a-sdk>=1.3.0,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
kairos = "kairos.main:main"
kairos-data = "kairos.cli:main"
kairos-refresh = "kairos.pipeline.refresh:main"
kairos-schedule = "kairos.pipeline.scheduler:main"
kairos-web = "kairos.web.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
database = [
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kairos*", "schemas*", "collectors*", "mcp_servers*"]

[tool.setuptools.package-data]
"kairos_config" = ["agents/*.jsonc", "prompts/*.jsonc", "providers/*.json", "observability.jsonc", "security.jsonc", ".env.example", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

